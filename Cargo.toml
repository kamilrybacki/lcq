[package]
name = "lcq"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "LoRa-based Confidence Quorum Protocol: known-membership endorsement for constrained radio networks"
license = "MIT"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
blake2 = { version = "0.10", default-features = false }
lora-phy = { git = "https://github.com/lora-rs/lora-rs", version = "3.0.2-alpha" }
lora-modulation = { git = "https://github.com/lora-rs/lora-rs", version = "0.1.5" }
embedded-hal = "1"
embedded-hal-async = "1"
serial2 = { version = "0.2", optional = true, features = ["unix"] }
spidev = { version = "0.6", optional = true }
gpio-cdev = { version = "0.6", optional = true }

[dev-dependencies]
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The pre-flight tool talks to a board, so it needs the serial port.
[[bin]]
name = "lcq-bridge"
path = "src/bin/lcq-bridge.rs"
required-features = ["hardware"]

[features]
default = ["hardware"]
# Real radios: an RNode on a serial port, an SX1262 on spidev and GPIO.
hardware = ["dep:serial2", "dep:spidev", "dep:gpio-cdev"]
# The container harness's adversary modes on `lcq-node --adversary`. Never in a
# production build: without it the flag refuses to run.
harness = []
