name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --all-targets
      - name: tests
        # The container suite (tests/containers.rs) needs Docker and a musl
        # toolchain and takes ten minutes a radio; it stays a local gate.
        run: |
          cargo test --lib --bins --examples
          cargo test --doc
          for source in tests/*.rs; do
            name=$(basename "$source" .rs)
            [ "$name" = containers ] && continue
            cargo test --test "$name"
          done
